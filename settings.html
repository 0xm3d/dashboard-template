<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <!-- <link rel="stylesheet" href="css/normalize.css"> -->
    <link rel="stylesheet" href="css/framework.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;500&display=swap" rel="stylesheet">
</head>

<body>
    <div class="page d-flex">
        <div class="sidebar bg-white p-20 relative">
            <h3 class="cap relative txt-c mt-0">m3d</h3>
            <ul>
                <li>
                    <a href="index.html" class=" d-flex align-c fs-14 c-black rad-6 p-10 mb-5">
                        <i class="fa-regular fa-chart-bar fa-fw"></i>
                        <span class="fs-14  cap hide-mo">dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="settings.html" class="active d-flex align-c fs-14 c-black rad-6 p-10 mb-5">
                        <i class="fa-solid fa-user-gear fa-fw"></i>
                        <span class="fs-14  cap hide-mo">settings</span>
                    </a>
                </li>
                <li>
                    <a href="profile.html" class="d-flex align-c fs-14 c-black rad-6 p-10 mb-5">
                        <i class="fa-regular fa-circle-user fa-fw"></i>
                        <span class="fs-14  cap hide-mo">profile</span>
                    </a>
                </li>
                <li>
                    <a href="projects.html" class="d-flex align-c fs-14 c-black rad-6 p-10 mb-5">
                        <i class="fa-solid fa-diagram-project fa-fw"></i>
                        <span class="fs-14  cap hide-mo">projects</span>
                    </a>
                </li>
                <li>
                    <a href="courses.html" class="d-flex align-c fs-14 c-black rad-6 p-10 mb-5">
                        <i class="fa-solid fa-graduation-cap fa-fw"></i>
                        <span class="fs-14  cap hide-mo">courses</span>
                    </a>
                </li>
                <li>
                    <a href="friends.html" class="d-flex align-c fs-14 c-black rad-6 p-10 mb-5">
                        <i class="fa-solid fa-user-group fa-fw"></i>
                        <span class="fs-14  cap hide-mo">friends</span>
                    </a>
                </li>
                <li>
                    <a href="files.html" class="d-flex align-c fs-14 c-black rad-6 p-10 mb-5">
                        <i class="fa-regular fa-file fa-fw"></i>
                        <span class="fs-14  cap hide-mo">files</span>
                    </a>
                </li>
                <li>
                    <a href="plans.html" class="d-flex align-c fs-14 c-black rad-6 p-10 mb-5">
                        <i class="fa-regular fa-credit-card fa-fw"></i>
                        <span class="fs-14  cap hide-mo">plans</span>
                    </a>
                </li>
            </ul>
        </div>
        <div class="content w-full hidden">
            <div class="head bg-white p-15 between-flex ">
                <div class="search relative">
                    <input class="p-10 rad-10 b-ccc ml-5" type="search" placeholder="Type A Keyword">
                </div>
                <div class="icons d-flex align-c">
                    <span class="notif relative">
                        <i class="fa-regular fa-bell fa-lg"></i>
                    </span>
                    <img class="icon-32 ml-15" src="images/avatar.png" alt="profile picture">
                </div>
            </div>
            <h1 class="relative cap">settings</h1>
            <div class="settings-page m-20 d-grid gap-20">
                <div class="p-20 bg-white rad-10 cap">
                    <h2 class="mt-0 mb-10">site control</h2>
                    <p class="mt-0 mb-20 c-gray fs-15">control the website if there is maintenance</p>
                    <div class="mb-15 between-flex ">
                        <div>
                            <span>website control</span>
                            <p class="c-gray mt-5 mb-0 fs-13">open / close website and type the reason</p>
                        </div>
                        <div>
                            <label>
                                <input type="checkbox" class="toggle-checkbox" checked>
                                <div class="toggle-switch"></div>
                            </label>
                        </div>
                    </div>
                    <textarea class="close-message br-0 p-10 rad-6 d-block w-full" placeholder="Close Message Content"></textarea>
                </div>
                <div class="gen-info p-20 bg-white rad-10 cap">
                    <h2 class="mt-0 mb-10">general info</h2>
                    <p class="c-gray fs-13 mt-0 mb-20">general information about your account</p>
                    <div class="mb-20">
                        <label class="c-gray fs-14 d-block mb-10 mt-0">first name</label>
                        <input class="p-10 mt-0 rad-6 b-ccc w-full" type="text" placeholder="First Name">
                    </div>
                    <div class="mb-20">
                        <label class="c-gray fs-14 d-block mt-0 mb-10">last name</label>
                        <input class="p-10 mt-0 rad-6 b-ccc w-full" type="text" placeholder="last Name">
                    </div>
                    <div class="mb-20">
                        <label class="c-gray fs-14 d-block mt-0 mb-10">email</label>
                        <input class="p-10 mt-0 rad-6 b-ccc mr-10 d-inline-flex" type="email" value="o@nn.sa" readonly>
                        <a href="#" class="c-blue fs-15">change</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
